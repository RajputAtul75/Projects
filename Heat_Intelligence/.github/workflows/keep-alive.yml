name: Keep Render Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent Render from sleeping
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "Error: RENDER_URL secret is not set."
            echo "Please go to GitHub Repo Settings -> Secrets and variables -> Actions"
            echo "and add a new repository secret named RENDER_URL with your backend URL."
            exit 1
          fi
          
          echo "Pinging backend at ${{ secrets.RENDER_URL }}..."
          curl -s -o /dev/null -w "HTTP Code: %{http_code}\n" "${{ secrets.RENDER_URL }}"
          echo "Ping successful! The backend will stay awake."
